version: 2
updates:
  # Composer dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "composer"
    reviewers:
      - "kelsoncm"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
